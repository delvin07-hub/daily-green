name: Daily Green Commit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create 6 daily commits
        run: |
          git config --local user.name "delvin07-hub"
          git config --local user.email "145919123+delvin07-hub@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            TIMESTAMP=$(date -u)
            echo "Commit #$i | $TIMESTAMP" >> commit_log.txt
            git add commit_log.txt
            git commit -m "chore: daily green #$i [skip ci]"
            sleep $((RANDOM % 60))
          done
          git push